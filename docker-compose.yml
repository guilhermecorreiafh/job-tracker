services:
  db:
    image: postgres:17
    container_name: jobtracker-db
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=jobtracker_demo;Username=jobtracker;Password=jobtracker"
      SeedDemoData: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata: